[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "korgalore"
version = "0.8-dev"
description = "A tool to put public-inbox messages into your Gmail inbox."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "COPYING"}
authors = [
    {name = "Konstantin Ryabitsev", email = "konstantin@linuxfoundation.org"}
]
keywords = ["gmail", "cli", "email", "google-api", "lore.kernel.org", "public-inbox"]
classifiers = [
    "Intended Audience :: Developers",
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.1.0",
    # 2.34.0 is the first release that stopped importing pkg_resources at
    # module scope. Anything older fails to import on a modern venv, where
    # setuptools is not installed by default. Found by ci-matrix.sh's
    # floor lane; do not lower this without re-running it.
    "google-api-python-client>=2.34.0",
    # These two floors are set by what current distro stables package, so that
    # korgalore installs on a stock Debian or EL10 without pulling anything
    # from PyPI: click 8.1.7 is EL10's, click-log 0.3.2 is trixie's. Both are
    # exercised by misc/distro/ and by ci-matrix.sh's floor lane -- see
    # progress_file() in cli.py for the one API difference that mattered.
    "click>=8.1.7",
    "click-log>=0.3.2",
    "liblore>=0.9.0",
]

[dependency-groups]
dev = [
    "mypy",
    "pip-tools",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
    "types-requests",
]

[project.optional-dependencies]
gui = [
    "PyGObject>=3.42.0",
]

[project.scripts]
kgl = "korgalore.cli:main"

[project.urls]
Homepage = "https://git.kernel.org/pub/scm/utils/korgalore/korgalore.git/"
Repository = "https://git.kernel.org/pub/scm/utils/korgalore/korgalore.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/man/man1" = ["man/kgl.1"]
"share/man/man5" = ["man/korgalore.toml.5"]
"share/bash-completion/completions" = ["completions/kgl.bash"]
"share/zsh/site-functions" = ["completions/kgl.zsh"]
"share/fish/vendor_completions.d" = ["completions/kgl.fish"]

[tool.pip-tools]
generate-hashes = true

[tool.pytest.ini_options]
# Turn an unrecognised setting in this section into an error. Without it
# pytest only warns, which is how asyncio_default_fixture_loop_scope sat here
# unnoticed: it configures pytest-asyncio, a plugin we do not depend on, for
# async tests we do not have.
addopts = ["--strict-config"]
# Keep collection out of the liblore submodule, which ships its own test
# suite with dependencies we do not carry.
testpaths = ["tests"]

[tool.mypy]
# build/ is regenerated by setuptools and shadows src/korgalore as a duplicate
# "korgalore" module if left in the scan; liblore/ is a submodule with its own
# CI.
exclude = ["^build/", "^liblore/"]
strict = true
warn_unreachable = true
python_version = "3.11"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["build", "liblore"]

[tool.ruff.lint]
# Explicit select (not extend-select): ruff 0.16 expanded the default rule
# set, and we don't want upstream default changes to alter what we enforce.
select = [
    "E4",      # https://docs.astral.sh/ruff/rules/#error-e (imports)
    "E7",      # https://docs.astral.sh/ruff/rules/#error-e (statements)
    "E9",      # https://docs.astral.sh/ruff/rules/#error-e (runtime)
    "F",       # https://docs.astral.sh/ruff/rules/#pyflakes-f
    "B007",    # https://docs.astral.sh/ruff/rules/unused-loop-control-variable/
    "B904",    # https://docs.astral.sh/ruff/rules/raise-without-from-err/
    "C408",    # https://docs.astral.sh/ruff/rules/unnecessary-collection-call/
    "DTZ",     # https://docs.astral.sh/ruff/rules/#flake8-datetimez-dtz
    "G",       # https://docs.astral.sh/ruff/rules/#flake8-logging-format-g
    "I",       # https://docs.astral.sh/ruff/rules/#isort-i
    "PERF102", # https://docs.astral.sh/ruff/rules/incorrect-dict-iterator/
    "PGH004",  # https://docs.astral.sh/ruff/rules/blanket-noqa/
    "PIE790",  # https://docs.astral.sh/ruff/rules/unnecessary-placeholder/
    "PIE810",  # https://docs.astral.sh/ruff/rules/multiple-starts-ends-with/
    "ERA001",  # https://docs.astral.sh/ruff/rules/commented-out-code/
    "FURB110", # https://docs.astral.sh/ruff/rules/if-exp-instead-of-or-operator/
    "N806",    # https://docs.astral.sh/ruff/rules/non-lowercase-variable-in-function/
    "PERF401", # https://docs.astral.sh/ruff/rules/manual-list-comprehension/
    "PERF402", # https://docs.astral.sh/ruff/rules/manual-list-copy/
    "PLC0206", # https://docs.astral.sh/ruff/rules/dict-index-missing-items/
    "PLW1510", # https://docs.astral.sh/ruff/rules/subprocess-run-without-check/
    "PLW2901", # https://docs.astral.sh/ruff/rules/redefined-loop-name/
    "PTH",     # https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
    "PT006",   # https://docs.astral.sh/ruff/rules/pytest-parametrize-names-wrong-type/
    "PT011",   # https://docs.astral.sh/ruff/rules/pytest-raises-too-broad/
    "PT019",   # https://docs.astral.sh/ruff/rules/pytest-fixture-param-without-value/
    "RUF021",  # https://docs.astral.sh/ruff/rules/parenthesize-chained-operators/
    "RUF043",  # https://docs.astral.sh/ruff/rules/pytest-raises-ambiguous-pattern/
    "SIM102",  # https://docs.astral.sh/ruff/rules/collapsible-if/
    "SIM105",  # https://docs.astral.sh/ruff/rules/suppressible-exception/
    "SIM115",  # https://docs.astral.sh/ruff/rules/open-file-with-context-handler/
    "TC006",   # https://docs.astral.sh/ruff/rules/runtime-cast-value/
    "UP",      # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "RET505",  # https://docs.astral.sh/ruff/rules/superfluous-else-return/
    "RET506",  # https://docs.astral.sh/ruff/rules/superfluous-else-raise/
    "RET507",  # https://docs.astral.sh/ruff/rules/superfluous-else-continue/
    "RET508",  # https://docs.astral.sh/ruff/rules/superfluous-else-break/
    "RUF059",  # https://docs.astral.sh/ruff/rules/unused-unpacked-variable/
    "RUF100",  # https://docs.astral.sh/ruff/rules/unused-noqa/
    "SIM103",  # https://docs.astral.sh/ruff/rules/needless-bool/
    "SIM113",  # https://docs.astral.sh/ruff/rules/enumerate-for-loop/
    "SIM118",  # https://docs.astral.sh/ruff/rules/in-dict-keys/
    "SIM201",  # https://docs.astral.sh/ruff/rules/negate-equal-op/
]
flake8-quotes.inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
# pyright automatically ignores virtual environments and other directories, but
# once we specify `exclude`, we're on our own. See
# https://github.com/microsoft/pyright/issues/9057#issuecomment-2366938099.
exclude = [".venv*", "build", "liblore"]
typeCheckingMode = "strict"

# Overly strict rules.
reportConstantRedefinition = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownVariableType = false

# False positives caused by underscore-prefixed functions used across files.
# Might be good to clean this up.
reportPrivateUsage = false
reportUnusedFunction = false

[tool.ty.src]
exclude = ["build/", "liblore/"]

[tool.ty.rules]
all = "error"
# Flags every method that overrides a base-class method without @override.
# Adopting it would require a typing_extensions dependency for the 3.11
# fallback (typing.override is 3.12+), which is too much weight for a style
# rule. Revisit if/when the supported Python floor moves to 3.12.
missing-override-decorator = "ignore"
# We run three type checkers, and they disagree about which third-party
# modules carry usable type information. ty resolves google-auth and
# googleapiclient fine, so it sees the "type: ignore" comments those imports
# need for mypy and pyright as redundant. Whether a suppression is unused is
# not a question one checker out of three can answer on its own.
unused-type-ignore-comment = "ignore"
# "if value:" on an optional string or collection is our idiom for "set
# and not empty". Spelling it bool(value) adds noise, and "is not None"
# would change what an empty value does.
truthiness-test-of-none-union = "ignore"
# Annotating a value that comes from click's ctx.obj, JSON or a mock is
# how such a value gets its type here. mypy and pyright accept that; the
# alternative is a cast() at every one of those places.
unsound-assignment = "ignore"
# ty keeps an attribute narrowed across a method call that changes it, or
# while a GUI callback on another thread changes it, so this reports
# conditions that can be false as always true.
redundant-condition-strict = "ignore"
# click_log ships no type information, and we cannot fix that here.
dynamic-function-decorator-return = "ignore"
# The one hit is a test that casts None on purpose: callers pass header
# lookups straight in, so the function must survive None.
disjoint-cast = "ignore"
